name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  apps:
    name: Check and build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [estetica, tattoo]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @littzite/${{ matrix.app }} check
      - run: pnpm --filter @littzite/${{ matrix.app }} build
      - run: pnpm --filter @littzite/${{ matrix.app }} test
